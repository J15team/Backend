name: E2E Test

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build without tests
        run: ./gradlew build --no-daemon -x test

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Wait for application to start
        run: |
          echo "Waiting for application to start..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/actuator/health > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          docker compose logs
          exit 1

      - name: Run E2E tests
        run: |
          set -e

          # ===== 認証テスト =====
          echo "=== Testing Authentication ==="

          # サインアップ
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","email":"test@example.com","password":"testpass123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 201 ] || { echo "Signup failed: $HTTP_CODE"; exit 1; }
          echo "✅ Signup test passed"

          # サインイン
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"testpass123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Signin failed: $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q "accessToken" || { echo "No accessToken"; exit 1; }
          USER_TOKEN=$(echo "$BODY" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          echo "✅ Signin test passed"

          # バリデーションエラー
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser2","email":"invalid-email","password":"testpass123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 400 ] || { echo "Validation should fail: $HTTP_CODE"; exit 1; }
          echo "✅ Validation test passed"

          # 重複メール
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser3","email":"test@example.com","password":"testpass123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 400 ] || { echo "Duplicate email should fail: $HTTP_CODE"; exit 1; }
          echo "✅ Duplicate email test passed"

          # 誤ったパスワード
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"wrongpassword"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 400 ] || { echo "Wrong password should fail: $HTTP_CODE"; exit 1; }
          echo "✅ Wrong password test passed"

          # ===== 管理者テスト =====
          echo "=== Testing Admin ==="

          ADMIN_KEY="admin-secret-key-change-in-production"

          # 管理者作成
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/admin/users \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -d '{"email":"admin@example.com","username":"adminuser","password":"adminpass123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          [ "$HTTP_CODE" -eq 201 ] || { echo "Admin creation failed: $HTTP_CODE"; docker compose logs backend | tail -50; exit 1; }
          echo "$BODY" | grep -q "ROLE_ADMIN" || { echo "No ROLE_ADMIN"; exit 1; }
          echo "✅ Admin user created"

          # 無効な管理キー
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/admin/users \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: invalid-key" \
            -d '{"email":"invalid@example.com","username":"invaliduser","password":"pass123"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 401 ] || { echo "Invalid key should fail: $HTTP_CODE"; exit 1; }
          echo "✅ Invalid admin key rejected"

          # 管理者サインイン
          RESPONSE=$(curl -s -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"adminpass123"}')
          ADMIN_TOKEN=$(echo "$RESPONSE" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          ADMIN_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          # 管理者一覧
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/admin/users \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Admin list failed: $HTTP_CODE"; exit 1; }
          echo "✅ Admin list test passed"

          # 管理者更新
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "http://localhost:8080/api/admin/users/$ADMIN_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d '{"username":"updatedadmin","email":"updated@example.com"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Admin update failed: $HTTP_CODE"; exit 1; }
          echo "✅ Admin update test passed"

          # ===== 題材テスト =====
          echo "=== Testing Subjects ==="

          # 題材一覧（認証不要）
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/subjects)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Subjects list failed: $HTTP_CODE"; exit 1; }
          echo "✅ Subjects list test passed"

          # 認証なしで題材作成（403期待）
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/subjects \
            -H "Content-Type: application/json" \
            -d '{"subjectId":99,"title":"認証なし","description":"失敗するはず","maxSections":50}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 403 ] || { echo "Should require auth: $HTTP_CODE"; exit 1; }
          echo "✅ Auth required for subject creation"

          # 一般ユーザーで題材作成（403期待）
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/subjects \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $USER_TOKEN" \
            -d '{"subjectId":99,"title":"一般ユーザー","description":"失敗するはず","maxSections":50}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 403 ] || { echo "ROLE_USER should not create: $HTTP_CODE"; exit 1; }
          echo "✅ RBAC verified for subjects"

          # 管理者で題材作成
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/subjects \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d '{"subjectId":99,"title":"Admin Created Subject","description":"By admin user","maxSections":50}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 201 ] || { echo "Admin subject creation failed: $HTTP_CODE"; exit 1; }
          echo "✅ Admin can create subjects"

          # ===== セクションテスト =====
          echo "=== Testing Sections ==="

          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/subjects/1/sections)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Sections list failed: $HTTP_CODE"; exit 1; }
          echo "✅ Sections API test passed"

          # ===== 進捗テスト =====
          echo "=== Testing Progress ==="

          # 進捗用ユーザー作成
          curl -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"progressuser","email":"progress@example.com","password":"password123"}' > /dev/null

          RESPONSE=$(curl -s -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"email":"progress@example.com","password":"password123"}')
          PROGRESS_TOKEN=$(echo "$RESPONSE" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)

          # 認証なしで進捗取得（403期待）
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/progress/subjects/1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 403 ] || { echo "Progress should require auth: $HTTP_CODE"; exit 1; }
          echo "✅ Auth required for progress"

          # 進捗取得
          RESPONSE=$(curl -s http://localhost:8080/api/progress/subjects/1 \
            -H "Authorization: Bearer $PROGRESS_TOKEN")
          echo "$RESPONSE" | grep -q '"clearedCount":0' || { echo "Initial progress should be 0"; exit 1; }
          echo "✅ Initial progress verified"

          # セクション完了マーク
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/progress/subjects/1/sections \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PROGRESS_TOKEN" \
            -d '{"sectionId":0}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 201 ] || { echo "Mark section failed: $HTTP_CODE"; exit 1; }
          echo "✅ Section marked as complete"

          # 重複マーク（400期待）
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/progress/subjects/1/sections \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PROGRESS_TOKEN" \
            -d '{"sectionId":0}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 400 ] || { echo "Duplicate mark should fail: $HTTP_CODE"; exit 1; }
          echo "✅ Duplicate mark rejected"

          # セクション完了削除
          RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE http://localhost:8080/api/progress/subjects/1/sections/0 \
            -H "Authorization: Bearer $PROGRESS_TOKEN")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Delete section failed: $HTTP_CODE"; exit 1; }
          echo "✅ Progress management test passed"

          # ===== タグテスト =====
          echo "=== Testing Tags ==="

          # タグ作成（管理者）
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/tags \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d '{"name":"Kotlin","type":"NORMAL"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          [ "$HTTP_CODE" -eq 201 ] || { echo "Tag creation failed: $HTTP_CODE"; exit 1; }
          echo "✅ Tag created"

          # タグ一覧
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/tags)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Tag list failed: $HTTP_CODE"; exit 1; }
          echo "✅ Tag list test passed"

          # タグ検索
          RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:8080/api/tags?search=Kot")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Tag search failed: $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q "Kotlin" || { echo "Search should find Kotlin"; exit 1; }
          echo "✅ Tag search test passed"

          # タグ存在確認
          RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:8080/api/tags/exists?name=Kotlin")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Tag exists check failed: $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"exists":true' || { echo "Tag should exist"; exit 1; }
          echo "✅ Tag exists test passed"

          # 題材にタグ付与（タグ名で指定）
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:8080/api/subjects/1/tags" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d '{"tagName":"Kotlin"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 201 ] || { echo "Add tag to subject failed: $HTTP_CODE"; exit 1; }
          echo "✅ Tag added to subject"

          # 題材のタグ一覧
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/subjects/1/tags)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Subject tags list failed: $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q "Kotlin" || { echo "Subject should have Kotlin tag"; exit 1; }
          echo "✅ Subject tags test passed"

          # タグ名で題材絞り込み
          RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:8080/api/subjects?tags=Kotlin")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          [ "$HTTP_CODE" -eq 200 ] || { echo "Filter by tag failed: $HTTP_CODE"; exit 1; }
          echo "✅ Filter subjects by tag test passed"

          echo ""
          echo "=========================================="
          echo "✅ All E2E tests passed!"
          echo "=========================================="

      - name: Test rate limiting
        run: |
          echo "=== Testing Rate Limiting ==="

          SUCCESS_COUNT=0
          RATE_LIMITED_COUNT=0

          for i in {1..90}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health)
            if [ "$HTTP_CODE" -eq 200 ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif [ "$HTTP_CODE" -eq 429 ]; then
              RATE_LIMITED_COUNT=$((RATE_LIMITED_COUNT + 1))
            fi
          done

          echo "Successful: $SUCCESS_COUNT, Rate limited: $RATE_LIMITED_COUNT"

          [ $SUCCESS_COUNT -ge 50 ] || { echo "Too few successful requests"; exit 1; }
          [ $RATE_LIMITED_COUNT -ge 5 ] || { echo "Rate limiting not working"; exit 1; }

          # ヘッダー確認
          HEADERS=$(curl -s -I http://localhost:8080/api/health)
          echo "$HEADERS" | grep -qi "X-RateLimit-Limit" || { echo "Missing rate limit header"; exit 1; }

          echo "✅ Rate limiting test passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
